            // ============ 工具函数 ============
            function drawRoundRect(ctx, x, y, w, h, r) {
                if (typeof ctx.roundRect === 'function') {
                    ctx.beginPath();
                    ctx.roundRect(x, y, w, h, r);
                } else {
                    ctx.beginPath();
                    ctx.moveTo(x + r, y);
                    ctx.lineTo(x + w - r, y);
                    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                    ctx.lineTo(x + w, y + h - r);
                    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    ctx.lineTo(x + r, y + h);
                    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                    ctx.lineTo(x, y + r);
                    ctx.quadraticCurveTo(x, y, x + r, y);
                    ctx.closePath();
                }
            }

            // 颜色映射：根->蓝，一级->黄，二级->绿，三级->青，四级->紫
            function getBorderColor(depth, isRoot) {
                if (isRoot) return '#4a9eff'; // 蓝色
                switch (depth) {
                    case 1:
                        return '#ffd93d'; // 黄色
                    case 2:
                        return '#6bcb77'; // 绿色
                    case 3:
                        return '#4fc3f7'; // 青色
                    default:
                        return '#ce93d8'; // 紫色
                }
            }

            function getBackgroundColor(depth, isRoot) {
                if (isRoot) return 'rgba(20,60,120,.96)';
                switch (depth) {
                    case 1:
                        return 'rgba(80,70,30,.93)';
                    case 2:
                        return 'rgba(30,70,40,.90)';
                    case 3:
                        return 'rgba(20,60,80,.90)';
                    default:
                        return 'rgba(50,30,70,.90)';
                }
            }

            function getTextColor(depth, isRoot) {
                if (isRoot) return '#ffffff';
                switch (depth) {
                    case 1:
                        return '#fff8e0';
                    case 2:
                        return '#e0ffe0';
                    case 3:
                        return '#e0f8ff';
                    default:
                        return '#f0e0ff';
                }
            }

            function createCard(text, isRoot = false, depth = 1) {
                const c = document.createElement("canvas");
                c.width = 800;
                c.height = 240;
                const ctx = c.getContext("2d");
                ctx.clearRect(0, 0, 800, 240);

                const bgColor = getBackgroundColor(depth, isRoot);
                const borderColor = getBorderColor(depth, isRoot);
                const textColor = getTextColor(depth, isRoot);
                let fontSize = isRoot ? 52 : (depth === 1 ? 44 : 38);
                const borderWidth = isRoot ? 4 : (depth === 1 ? 3 : 2);

                ctx.fillStyle = bgColor;
                drawRoundRect(ctx, 15, 15, 770, 210, 35);
                ctx.fill();

                ctx.strokeStyle = borderColor;
                ctx.lineWidth = borderWidth;
                ctx.shadowColor = isRoot ? 'rgba(74,158,255,.7)' : 'rgba(255,200,50,.5)';
                ctx.shadowBlur = 12;
                drawRoundRect(ctx, 15, 15, 770, 210, 35);
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.fillStyle = textColor;
                let displayText = text;
                if (text.length > 8) fontSize -= 6;
                if (text.length > 12) fontSize -= 12;
                ctx.font = 'bold ' + fontSize + 'px "Microsoft YaHei","Noto Sans SC",sans-serif';
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(displayText, 400, 135);

                const tex = new THREE.CanvasTexture(c);
                tex.minFilter = THREE.LinearFilter;
                tex.generateMipmaps = false;

                const scaleX = isRoot ? 210 : (depth === 1 ? 190 : 170);
                const scaleY = isRoot ? 68 : (depth === 1 ? 62 : 56);
                const sprite = new THREE.Sprite(
                    new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false })
                );
                sprite.scale.set(scaleX, scaleY, 1);
                return sprite;
            }

            // ============ 构建层级树 ============
            function buildTree(node, parent = null, level = 0) {
                node.parent = parent;
                node.level = level;
                node.expanded = false;
                node.children = node.children || [];
                node.children.forEach(child => buildTree(child, node, level + 1));
                return node;
            }
            buildTree(anatomyData);

            // ============ 分配位置 ============
            const levelRadius = [0, 280, 120, 60, 30];

            function assignPositions(node, parentPos, childIndex, totalChildren) {
                let pos;
                if (node.level === 0) {
                    pos = new THREE.Vector3(0, 0, 0);
                } else {
                    const phi = Math.acos(-1 + (2 * childIndex + 1) / totalChildren);
                    const theta = Math.sqrt(totalChildren * Math.PI) * phi;
                    const dir = new THREE.Vector3(
                        Math.sin(phi) * Math.cos(theta),
                        Math.sin(phi) * Math.sin(theta),
                        Math.cos(phi)
                    );
                    const radius = levelRadius[node.level] || 20;
                    pos = parentPos.clone().add(dir.multiplyScalar(radius));
                }
                node.position = pos;
                const children = node.children || [];
                children.forEach((child, idx) => {
                    assignPositions(child, pos, idx, children.length);
                });
            }
            assignPositions(anatomyData, null, 0, 1);

            // ============ 创建场景 ============
            const rootGroup = new THREE.Group();
            scene.add(rootGroup);

            const allNodes = [];

            function createScene(node) {
                allNodes.push(node);
                const isRoot = node.level === 0;
                const sprite = createCard(node.name, isRoot, node.level);
                sprite.position.copy(node.position);
                sprite.userData.node = node;
                rootGroup.add(sprite);
                node.sprite = sprite;

                // 仅根节点默认可见
                sprite.visible = (node.level === 0);

                node.lines = [];
                const children = node.children || [];
                children.forEach(child => {
                    const startPos = node.position;
                    const endPos = child.position;
                    let mid = startPos.clone().add(endPos).multiplyScalar(0.55).normalize();
                    if (startPos.length() < 0.1) {
                        const dir = endPos.clone().normalize();
                        mid.copy(dir.multiplyScalar(150));
                    } else {
                        mid.multiplyScalar(startPos.length() * 1.15 || 300);
                    }
                    const curve = new THREE.QuadraticBezierCurve3(startPos, mid, endPos);
                    const points = curve.getPoints(30);
                    const geometry = new THREE.BufferGeometry().setFromPoints(points);
                    const material = new THREE.LineBasicMaterial({
                        color: 0x3388cc,
                        transparent: true,
                        opacity: 0.45,
                    });
                    const line = new THREE.Line(geometry, material);
                    line.visible = false;
                    rootGroup.add(line);
                    node.lines.push(line);
                    child.line = line;

                    createScene(child);
                });
            }
            createScene(anatomyData);

            // ============ 展开/收起逻辑 ============
            function expandNode(node) {
                if (node.expanded) return;
                node.expanded = true;
                const children = node.children || [];
                children.forEach(child => {
                    child.sprite.visible = true;
                    if (child.line) child.line.visible = true;
                });
            }

            function collapseNode(node) {
                if (!node.expanded) return;
                node.expanded = false;
                // 隐藏所有后代并重置它们的 expanded 状态
                function hideAndReset(n) {
                    const kids = n.children || [];
                    kids.forEach(child => {
                        child.sprite.visible = false;
                        if (child.line) child.line.visible = false;
                        child.expanded = false; // 重置展开状态
                        hideAndReset(child); // 递归处理更深层
                    });
                }
                hideAndReset(node);
            }

            function toggleNode(node) {
                if (!node.children || node.children.length === 0) return;
                if (node.expanded) {
                    collapseNode(node);
                } else {
                    expandNode(node);
                }
            }

            // 根节点切换全部展开/收起
            function toggleRoot(node) {
                if (node.level !== 0) return;
                const firstLevel = node.children || [];
                const anyVisible = firstLevel.some(child => child.sprite.visible);
                if (anyVisible) {
                    // 收起所有一级及其后代
                    firstLevel.forEach(child => {
                        if (child.expanded) collapseNode(child);
                        child.sprite.visible = false;
                        if (child.line) child.line.visible = false;
                        // 重置所有后代状态
                        function resetAll(n) {
                            (n.children || []).forEach(grand => {
                                grand.sprite.visible = false;
                                if (grand.line) grand.line.visible = false;
                                grand.expanded = false;
                                resetAll(grand);
                            });
                        }
                        resetAll(child);
                    });
                    node.expanded = false;
                } else {
                    // 展开所有一级
                    firstLevel.forEach(child => {
                        child.sprite.visible = true;
                        if (child.line) child.line.visible = true;
                    });
                    node.expanded = true;
                }
            }

            // ============ 交互 ============
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            const modal = document.getElementById("modal");

            function getAllSprites(node) {
                let sprites = [node.sprite];
                (node.children || []).forEach(child => {
                    sprites = sprites.concat(getAllSprites(child));
                });
                return sprites;
            }
            const allSprites = getAllSprites(anatomyData);

            renderer.domElement.addEventListener("click", function(e) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const hits = raycaster.intersectObjects(allSprites);

                if (hits.length > 0) {
                    const sprite = hits[0].object;
                    // 关键：如果精灵不可见，忽略点击
                    if (!sprite.visible) return;

                    const node = sprite.userData.node;
                    if (!node) return;

                    if (node.level === 0) {
                        toggleRoot(node);
                    } else {
                        toggleNode(node);
                    }

                    // 显示信息卡片
                    let html = '<h2>' + node.name + '</h2><p>' + (node.detail || '（无详细描述）') + '</p>';
                    const childCount = node.children ? node.children.length : 0;
                    if (childCount > 0) {
                        const childNames = node.children.map(c => c.name).join('、');
                        html += '<div class="tag">子节点（' + childCount + '个）：' + childNames + '</div>';
                        if (node.level === 0) {
                            const status = node.expanded ? '已全部展开' : '已全部收起';
                            html += '<p class="hint">根节点状态：' + status + '，点击可切换</p>';
                        } else {
                            const status = node.expanded ? '已展开' : '已收起';
                            html += '<p class="hint">当前状态：' + status + '，点击可切换</p>';
                        }
                    } else {
                        html += '<div class="tag">此节点无子节点</div>';
                    }
                    modal.innerHTML = html;
                    modal.style.display = "block";
                } else {
                    modal.style.display = "none";
                }
            });

            renderer.domElement.addEventListener("mousemove", function(e) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const hits = raycaster.intersectObjects(allSprites);
                let hover = false;
                if (hits.length > 0 && hits[0].object.visible) {
                    hover = true;
                }
                renderer.domElement.style.cursor = hover ? 'pointer' : 'grab';
            });

            // ============ OrbitControls ============
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.35;
            controls.enablePan = false;
            controls.minDistance = 420;
            controls.maxDistance = 1600;
            controls.target.set(0, 0, 0);

            controls.addEventListener('start', function() { controls.autoRotate = false; });
            controls.addEventListener('end', function() {
                setTimeout(function() {
                    if (!controls._isInteracting) controls.autoRotate = true;
                }, 2000);
            });
            controls._isInteracting = false;
            renderer.domElement.addEventListener('pointerdown', function() { controls._isInteracting = true; });
            renderer.domElement.addEventListener('pointerup', function() {
                setTimeout(function() { controls._isInteracting = false; }, 100);
            });

            // ============ 星空背景 ============
            const starGeo = new THREE.BufferGeometry();
            const starCount = 2200;
            const starPos = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount * 3; i++) {
                starPos[i] = (Math.random() - 0.5) * 2600;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            const starMat = new THREE.PointsMaterial({
                color: 0x88aacc,
                size: 1.6,
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
            });
            scene.add(new THREE.Points(starGeo, starMat));

            // ============ 中心光晕 ============
            const glow = new THREE.Mesh(
                new THREE.SphereGeometry(18, 32, 32),
                new THREE.MeshBasicMaterial({
                    color: 0x4488ff,
                    transparent: true,
                    opacity: 0.35,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                })
            );
            scene.add(glow);

            // ============ 动画循环 ============
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            // ============ 窗口自适应 ============
            window.addEventListener('resize', function() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // ============ 快捷键 ============
            window.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') modal.style.display = 'none';
                if (e.key === 'r' || e.key === 'R') controls.autoRotate = !controls.autoRotate;
            });

            console.log('✅ 层级解剖学思维导图已加载，共 ' + allNodes.length + ' 个节点，初始仅显示根节点。');
        });
    </script>
</body>
</html>
